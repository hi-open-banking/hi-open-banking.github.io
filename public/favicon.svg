<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0A2540"/>

  <!-- 简化 O -->
  <circle cx="32" cy="23" r="11"
          fill="none" stroke="#FFFFFF" stroke-width="6"/>

  <!-- 下划线 -->
  <rect x="17" y="40" width="30" height="4" rx="2" fill="#FFFFFF"/>

  <!-- 简化 //：整体居中，左右对称，round cap 不越界 -->
